<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ДЗ1 — тест TransactionCard</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f4f5f7; color: #1d2433; }
      .page { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
      .page__header h1 { margin: 0 0 4px; font-size: 24px; }
      .page__balance { margin: 0 0 20px; color: #5b6475; }
      .list { display: flex; flex-direction: column; gap: 10px; }
      .tx-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(16,24,40,.06); border-left: 4px solid transparent; }
      .tx-card--income { border-left-color: #1f9d55; }
      .tx-card--expense { border-left-color: #d64545; }
      .tx-card__main { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
      .tx-card__category { font-weight: 600; }
      .tx-card__comment { font-size: 14px; color: #3b4456; }
      .tx-card__meta { font-size: 13px; color: #8a93a6; }
      .tx-card__side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      .tx-card__amount { white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
      .tx-card--income .tx-card__amount { color: #1f9d55; }
      .tx-card--expense .tx-card__amount { color: #d64545; }
      .tx-card__delete { border: 0; background: transparent; color: #8a93a6; font-size: 20px; cursor: pointer; width: 28px; height: 28px; border-radius: 6px; }
      @media (max-width: 400px) {
        .tx-card { padding: 12px; gap: 8px; }
        .tx-card__comment { font-size: 13px; }
      }
      .tx-card__delete:hover { background: #eef0f4; color: #d64545; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>
