name: CI/CD

# Пайплайн ДЗ6: проверки качества → тесты → аудит зависимостей → сборка → деплой на Vercel.
# Деплой выполняется ТОЛЬКО если все проверки прошли: сломанная версия не попадёт на сайт.
#   push в main      → production (основной адрес сайта)
#   pull request     → preview (отдельная временная ссылка, комментарий в PR)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый запуск для той же ветки отменяет предыдущий: на сайт уходит последняя версия.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия Vercel CLI зафиксирована, чтобы сборка не менялась сама по себе.
  VERCEL_CLI: vercel@61.1.0
  VERCEL_PROJECT: family-budget

jobs:
  quality:
    name: Проверки, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: Форматирование (Prettier)
        run: npm run format:check
      - name: Линтер (ESLint)
        run: npm run lint
      - name: Типы (TypeScript)
        run: npm run typecheck
      - name: Тесты (Vitest)
        run: npm test
      - name: Аудит зависимостей сайта (npm audit)
        # Только зависимости, которые попадают в браузер; high и critical останавливают пайплайн.
        run: npm audit --omit=dev --audit-level=high
      - name: Сборка
        run: npm run build
        env:
          # Адрес Supabase и публичный ключ anon (не секреты, но и не в коде — правило 17).
          # Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

  deploy-production:
    name: Деплой на Vercel (production)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.site }}
    env:
      # Токен Vercel — секрет GitHub: Settings → Secrets and variables → Actions → Secrets.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Проверка токена Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Не задан секрет VERCEL_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - name: Проект на Vercel (создаётся при первом запуске)
        run: |
          npx --yes "$VERCEL_CLI" project add "$VERCEL_PROJECT" --token="$VERCEL_TOKEN" || true
          npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Сборка для Vercel
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Публикация
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          # Постоянный адрес сайта (alias) — самый короткий из адресов *.vercel.app этой публикации.
          site=$(npx --yes "$VERCEL_CLI" inspect "$url" --token="$VERCEL_TOKEN" 2>&1 \
            | grep -oE 'https://[a-z0-9.-]+\.vercel\.app' | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "site=${site:-$url}" >> "$GITHUB_OUTPUT"
          echo "Сайт: ${site:-$url}  (публикация: $url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Проверка после деплоя (smoke test)
        run: |
          site="${{ steps.deploy.outputs.site }}"
          for path in / /reports /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$site$path")
            echo "$site$path → HTTP $code"
            [ "$code" = "200" ] || exit 1
          done

  deploy-preview:
    name: Деплой на Vercel (preview)
    # PR из форков не получает секреты — превью только для веток этого репозитория.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Проект на Vercel
        run: |
          npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Сборка для Vercel
        run: npx --yes "$VERCEL_CLI" build --token="$VERCEL_TOKEN"
      - name: Публикация превью
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Превью: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Ссылка на превью в Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "Превью этой версии сайта: $URL"
